<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Apply the persisted/system color mode before the first paint so the
      // page doesn't flash the stylesheet's default dark theme in light mode.
      ;(function () {
        var cls = "dark"
        try {
          var mode = localStorage.getItem("nuxt-color-mode") || "system"
          cls =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode
        } catch (_) {
          cls = "dark"
        }
        document.documentElement.className = cls
      })()
    </script>
    <script>
      globalThis.import_meta_env = JSON.parse('"import_meta_env_placeholder"')
    </script>
    <title>Hoppscotch • Open source API development ecosystem</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Shims to make swagger-parser package work
      window.global = window
    </script>
    <script type="module">
      import { Buffer } from "buffer"
      import process from "process"

      // // Shims to make postman-collection work
      window.Buffer = Buffer
      window.process = process
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
